# -Djava.net.preferIPv4Stack=true keeps the Gradle daemon's loopback control
# channel on 127.0.0.1; in network sandboxes that gate non-loopback TCP, the
# IPv6-preferred stack otherwise sources daemon connections from a global
# address and the daemon handshake is intercepted/broken.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.enableJetifier=true
